
services:
  # ─── Frontend (React) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codesphere-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost/api
    depends_on:
      - backend
    networks:
      - codesphere-network
    restart: unless-stopped

  # ─── Backend (Node.js + Express) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codesphere-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/codesphere}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-codesphere_super_secret_key_2024}
      - JWT_EXPIRE=7d
      - EXECUTION_TIMEOUT=10000
      - MAX_MEMORY=256m
      - MAX_CPUS=1
    depends_on:
      - mongodb
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codesphere-network
    restart: unless-stopped

  # ─── Executor Service ───────────────────────────────
  executor-service:
    build:
      context: ./executor-service
      dockerfile: Dockerfile
    container_name: codesphere-executor
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EXECUTION_TIMEOUT=10000
      - MAX_MEMORY=256m
      - MAX_CPUS=1
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codesphere-network
    restart: unless-stopped

  # ─── MongoDB ────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: codesphere-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - codesphere-network
    restart: unless-stopped

  # ─── Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: codesphere-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codesphere-network
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: codesphere-nginx
    ports:
      - "8000:80"
    depends_on:
      - frontend
      - backend
    networks:
      - codesphere-network
    restart: unless-stopped

  # ─── Jenkins CI/CD ──────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts
    container_name: codesphere-jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codesphere-network
    restart: unless-stopped

  # ─── Prometheus ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: codesphere-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - codesphere-network
    restart: unless-stopped

  # ─── Grafana ────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: codesphere-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=codesphere123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - codesphere-network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  jenkins_data:
  prometheus_data:
  grafana_data:

networks:
  codesphere-network:
    driver: bridge
