name: CodeSphere CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  #  Lint and Test job
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name:  Install Backend Dependencies
        run: |
          cd backend
          npm install --no-audit --no-fund

      - name:  Run Backend Tests
        run: |
          cd backend
          npm test

      - name: 📦 Install Frontend Dependencies
        run: |
          cd frontend
          npm install --no-audit --no-fund

      - name: 🧪 Run Frontend Tests
        env:
          CI: true
        run: |
          cd frontend
          npm test

  #  Docker Build job
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name:  Checkout code
        uses: actions/checkout@v4

      - name:  Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  Build Backend Image
        run: docker build -t codesphere-backend:latest ./backend

      - name:  Build Frontend Image
        run: docker build -t codesphere-frontend:latest ./frontend

      - name:  Build Executor Image
        run: docker build -t codesphere-executor:latest ./executor-service

      - name:  Build Nginx Image
        run: docker build -t codesphere-nginx:latest ./nginx
